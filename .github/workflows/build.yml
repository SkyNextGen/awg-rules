name: Build routing rules
on:
  schedule:
    # Daily refresh at 23:17 MSK; Monday follows the ITDog weekly publication.
    - cron: '17 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/**'
      - 'tests/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'config/**'
      - 'tests/**'
      - '.github/workflows/build.yml'
permissions:
  contents: write
concurrency:
  group: routing-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Verify ITDog scheduled publication
        if: github.event_name == 'schedule'
        run: python src/check_itdog.py
      - name: Install official sing-box
        run: python src/install_sing_box.py
      - name: Verify AWGM DNS matching
        run: |
          python tests/dns_probe.py .tools/sing-box 203.0.113.42
          python src/install_sing_box.py --version 1.14.1 --directory .tools-dns
          python tests/dns_probe.py .tools-dns/sing-box 127.0.0.1
      - name: Build and verify
        run: python src/build.py
        env:
          SING_BOX: .tools/sing-box
      - name: Verify service coverage
        run: python src/check_service_coverage.py
      - name: Build report
        run: cat dist/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish verified output
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified routing rules [skip ci]'
            git push
          fi
      - name: Telegram notification
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          BUILD_STATUS: ${{ job.status }}
        run: python src/notify.py

